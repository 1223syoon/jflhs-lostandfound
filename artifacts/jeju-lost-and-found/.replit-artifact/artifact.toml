kind = "web"
previewPath = "/"
title = "제주외고 분실물 센터"
description = "제주외국어고등학교 학생들이 PostgreSQL에 저장된 분실물을 검색하고 상세 정보와 수령 안내를 확인할 수 있는 한국어 반응형 웹앱입니다."
version = "1.0.0"
id = "artifacts/jeju-lost-and-found"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23972

[services.development]
run = "pnpm --filter @workspace/jeju-lost-and-found run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/jeju-lost-and-found", "run", "build" ]
serve = "static"
publicDir = "artifacts/jeju-lost-and-found/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23972"
BASE_PATH = "/"
