openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/user:
    get:
      operationId: getCurrentAuthUser
      tags: [auth]
      summary: Get the current administrator session
      responses:
        "200":
          description: Current user or unauthenticated state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentAuthUserResponse"
  /storage/uploads/request-url:
    post:
      operationId: requestStorageUploadUrl
      tags: [storage]
      summary: Request a persistent image upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageUploadRequest"
      responses:
        "200":
          description: Signed upload URL and database object path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageUploadResponse"
        "400":
          description: Invalid upload metadata
        "401":
          description: Administrator authentication required
  /storage/uploads/confirm:
    post:
      operationId: confirmStorageUpload
      tags: [storage]
      summary: Validate, normalize, and confirm a stored image
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageUploadConfirmationRequest"
      responses:
        "200":
          description: Normalized object verified after it was saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageUploadConfirmationResponse"
        "401":
          description: Administrator authentication required
        "422":
          description: Invalid image bytes or unsupported image format
        "502":
          description: Object storage verification failed
  /storage/objects/{objectPath}:
    get:
      operationId: getStoredObject
      tags: [storage]
      summary: Serve a persisted object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect to a short-lived object URL
        "404":
          description: Object not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AuthUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          nullable: true
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        profileImageUrl:
          type: string
          nullable: true
        isAdmin:
          type: boolean
      required:
        - id
        - email
        - firstName
        - lastName
        - profileImageUrl
        - isAdmin
    CurrentAuthUserResponse:
      type: object
      properties:
        user:
          allOf:
            - $ref: "#/components/schemas/AuthUser"
          nullable: true
      required:
        - user
    StorageUploadRequest:
      type: object
      properties:
        name:
          type: string
        size:
          type: number
        contentType:
          type: string
      required:
        - name
        - size
        - contentType
    StorageUploadResponse:
      type: object
      properties:
        uploadURL:
          type: string
        objectPath:
          type: string
        metadata:
          type: object
          properties:
            name:
              type: string
            size:
              type: number
            contentType:
              type: string
          required:
            - name
            - size
            - contentType
      required:
        - uploadURL
        - objectPath
        - metadata
    StorageUploadConfirmationRequest:
      type: object
      properties:
        objectPath:
          type: string
      required:
        - objectPath
    StorageUploadConfirmationResponse:
      type: object
      properties:
        objectPath:
          type: string
        contentType:
          type: string
          enum: [image/jpeg]
        size:
          type: number
          description: Stored image size in bytes
        width:
          type: number
          description: Normalized image width in pixels
        height:
          type: number
          description: Normalized image height in pixels
      required:
        - objectPath
        - contentType
        - size
        - width
        - height

